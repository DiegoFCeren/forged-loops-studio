name: Update Roblox Game Stats

on:
  schedule:
    # Every 15 minutes. GitHub may delay this slightly under load, and
    # scheduled workflows pause automatically after ~60 days with no repo
    # activity — a normal commit or a manual run (below) re-enables them.
    - cron: '*/15 * * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest Roblox stats
        run: node scripts/fetch-stats.js

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games-data.json
          git diff --quiet --cached || git commit -m "Update Roblox game stats"
          git push
